<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP 连接器</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --warn: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 12px; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select {
      background: #0d1117;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      min-width: 180px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 500;
    }
    button.danger { background: var(--danger); }
    button.secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .badge.success { background: rgba(63,185,80,0.15); color: var(--success); border-color: rgba(63,185,80,0.3); }
    .badge.danger { background: rgba(248,81,73,0.15); color: var(--danger); border-color: rgba(248,81,73,0.3); }
    .logs { max-height: 400px; overflow: auto; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .log-entry { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .log-entry:last-child { border-bottom: none; }
    .log-meta { color: var(--muted); }
    .log-error { color: var(--danger); }
    .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  </style>
</head>
<body>
  <header>
    <h1>MCP 一站式连接器</h1>
    <button class="secondary" onclick="location.reload()">刷新</button>
  </header>
  <main>
    <section class="card">
      <h2 style="margin:0 0 12px;font-size:15px;font-weight:600;">添加 MCP 服务</h2>
      <div class="row">
        <div>
          <label>服务名称</label>
          <input id="serverName" placeholder="my-server" />
        </div>
        <div>
          <label>模式</label>
          <select id="transport" onchange="toggleFields()">
            <option value="stdio">Stdio</option>
            <option value="sse">SSE</option>
            <option value="streamable-http">Streamable HTTP</option>
          </select>
        </div>
        <div id="cmdField">
          <label>命令</label>
          <input id="command" placeholder="npx" />
        </div>
        <div id="argsField">
          <label>参数</label>
          <input id="args" placeholder="-y @modelcontextprotocol/server-filesystem /tmp" />
        </div>
        <div id="urlField" style="display:none;">
          <label>URL</label>
          <input id="url" placeholder="http://localhost:3000/mcp" />
        </div>
        <div>
          <label>工作目录</label>
          <input id="cwd" placeholder="可选" />
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button onclick="addServer()">添加并启动</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 style="margin:0 0 12px;font-size:15px;font-weight:600;">服务列表</h2>
      <table>
        <thead>
          <tr><th>名称</th><th>模式</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody id="serverList"></tbody>
      </table>
    </section>

    <section class="card">
      <h2 style="margin:0 0 12px;font-size:15px;font-weight:600;">调用日志</h2>
      <div class="logs" id="logBox"><div class="empty">暂无日志</div></div>
    </section>
  </main>

  <script>
    const API = "/mcp/api";
    async function post(path, body) {
      const res = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      return res.json();
    }

    function toggleFields() {
      const t = document.getElementById("transport").value;
      document.getElementById("cmdField").style.display = t === "stdio" ? "block" : "none";
      document.getElementById("argsField").style.display = t === "stdio" ? "block" : "none";
      document.getElementById("urlField").style.display = t === "stdio" ? "none" : "block";
    }

    async function addServer() {
      const serverName = document.getElementById("serverName").value.trim();
      const transport = document.getElementById("transport").value;
      const command = document.getElementById("command").value.trim();
      const args = document.getElementById("args").value.trim().split(/\s+/).filter(Boolean);
      const url = document.getElementById("url").value.trim();
      const cwd = document.getElementById("cwd").value.trim();
      if (!serverName) return alert("服务名称不能为空");
      const payload = { serverName, transport, enabled: true };
      if (transport === "stdio") { payload.command = command; payload.args = args; if (cwd) payload.cwd = cwd; }
      else { payload.url = url; }
      const result = await post("/servers/add", payload);
      if (result.ok) { document.getElementById("serverName").value = ""; loadServers(); }
      else alert(result.error || "添加失败");
    }

    async function removeServer(id) {
      if (!confirm("确定删除该服务？")) return;
      const result = await post("/servers/remove", { id });
      if (result.ok) loadServers();
    }

    async function toggleServer(id, enabled) {
      const result = await post("/servers/toggle", { id, enabled });
      if (result.ok) loadServers();
    }

    async function restartServer(id) {
      const result = await post("/servers/restart", { id });
      if (result.ok) loadServers();
    }

    async function loadServers() {
      const servers = await post("/servers");
      const tbody = document.getElementById("serverList");
      tbody.innerHTML = "";
      if (!servers.length) { tbody.innerHTML = `<tr><td colspan="4" class="empty">暂无服务，请在上方添加</td></tr>`; return; }
      for (const s of servers) {
        const tr = document.createElement("tr");
        const statusBadge = s.connected
          ? `<span class="badge success">已连接</span>`
          : `<span class="badge danger">未连接</span>`;
        tr.innerHTML = `
          <td>${escapeHtml(s.serverName)}<div style="color:var(--muted);font-size:12px;">${escapeHtml(s.id)}</div></td>
          <td>${escapeHtml(s.transport)}</td>
          <td>${statusBadge}</td>
          <td>
            <button class="secondary" onclick="restartServer('${s.id}')">重启</button>
            <button class="secondary" onclick="toggleServer('${s.id}', ${!s.enabled})">${s.enabled ? "禁用" : "启用"}</button>
            <button class="danger" onclick="removeServer('${s.id}')">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function loadLogs() {
      const logs = await post("/logs");
      const box = document.getElementById("logBox");
      if (!logs.length) { box.innerHTML = `<div class="empty">暂无日志</div>`; return; }
      box.innerHTML = logs.map(l => {
        const time = new Date(l.timestamp).toLocaleTimeString();
        const err = l.isError ? "log-error" : "";
        const resultText = typeof l.result === "string" ? l.result : JSON.stringify(l.result);
        return `<div class="log-entry ${err}">
          <div class="log-meta">[${time}] ${escapeHtml(l.toolName)}</div>
          <div>args: ${escapeHtml(JSON.stringify(l.args))}</div>
          <div>result: ${escapeHtml(resultText)}</div>
        </div>`;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]);
    }

    loadServers();
    loadLogs();
    setInterval(loadServers, 5000);
    setInterval(loadLogs, 3000);
  </script>
</body>
</html>
